    <style id="expo-reset">
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        height: 100%;
        width: 100%;
        -webkit-text-size-adjust: none;
        text-size-adjust: none;
      }

      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #0c0c0e;
        overscroll-behavior: none;
        color: #f5f5f0;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-feature-settings: 'ss01', 'cv11';

        /* Always center the app like a phone frame */
        display: flex;
        justify-content: center;
      }

      /* Subtle vignette on the desktop "frame" background so the device
         doesn't look like it's floating on a flat slab */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 22% 18%, rgba(232, 112, 90, 0.10), transparent 45%),
          radial-gradient(circle at 78% 82%, rgba(120, 80, 200, 0.08), transparent 50%),
          #0c0c0e;
        z-index: -1;
        pointer-events: none;
      }

      /* Root fills height but is capped at mobile width so the app
         always looks like a phone app — on desktop, DevTools, or real device */
      #root {
        display: flex;
        width: 100%;
        max-width: 430px;
        height: 100%;
        position: relative;
        background-color: #0c0c0e;
        box-shadow:
          0 0 0 1px rgba(245, 245, 240, 0.04),
          0 30px 80px -20px rgba(0, 0, 0, 0.6);
      }

      /* Pre-mount loader: shown while the JS bundle is downloading and
         removed automatically as soon as React mounts and #root has children. */
      .ts-pre-loader {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(circle at 50% 38%, rgba(232, 112, 90, 0.18), transparent 55%),
          linear-gradient(180deg, #141416 0%, #0c0c0e 100%);
        color: #f5f5f0;
        text-align: center;
      }

      .ts-pre-loader__mark {
        width: 88px;
        height: 88px;
        border-radius: 24px;
        background:
          linear-gradient(135deg, #f28b78 0%, #c45a46 100%);
        display: grid;
        place-items: center;
        box-shadow:
          0 18px 48px -10px rgba(232, 112, 90, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
        animation: ts-mark-rise 700ms cubic-bezier(0.2, 0.9, 0.25, 1) both;
      }

      .ts-pre-loader__mark svg {
        width: 50px;
        height: 50px;
        fill: #ffffff;
      }

      .ts-pre-loader__title {
        margin: 8px 0 0;
        font-family: 'Fraunces', Georgia, serif;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -1.1px;
        font-variation-settings: 'opsz' 36, 'SOFT' 50;
        animation: ts-fade-up 700ms 80ms cubic-bezier(0.2, 0.9, 0.25, 1) both;
      }

      .ts-pre-loader__sub {
        margin: 0;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: rgba(245, 245, 240, 0.45);
        animation: ts-fade-up 700ms 160ms cubic-bezier(0.2, 0.9, 0.25, 1) both;
      }

      .ts-pre-loader__pulse {
        margin-top: 18px;
        width: 36px;
        height: 2px;
        border-radius: 1px;
        background: rgba(245, 245, 240, 0.18);
        overflow: hidden;
        position: relative;
      }

      .ts-pre-loader__pulse::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, #e8705a, transparent);
        animation: ts-pulse 1.4s ease-in-out infinite;
      }

      /* The pre-loader fades out the moment React inserts something into #root. */
      #root:not(:empty) .ts-pre-loader {
        opacity: 0;
        transform: scale(1.04);
        transition:
          opacity 350ms ease,
          transform 500ms ease;
        pointer-events: none;
      }

      @keyframes ts-mark-rise {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.94);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes ts-fade-up {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes ts-pulse {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
    </style>
