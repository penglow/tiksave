name: iOS Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_15.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer || echo "Using default Xcode"
      
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: Build iOS App
      run: |
        xcodebuild -project TikSave.xcodeproj \
          -scheme TikSave \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          clean build
      
    - name: Build Share Extension
      run: |
        xcodebuild -project TikSave.xcodeproj \
          -scheme TikSaveExtension \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          clean build
      
