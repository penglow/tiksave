name: Mobile App CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: TikSaveRN/package-lock.json
        
    - name: Install dependencies
      working-directory: ./TikSaveRN
      run: npm ci || npm install
      
    - name: Run ESLint
      working-directory: ./TikSaveRN
      run: npm run lint || true
      
    - name: Run TypeScript type check
      working-directory: ./TikSaveRN
      run: npm run typecheck
      
  # Note: For actual iOS/Android builds, use EAS Build
  # This workflow focuses on CI checks (linting, type checking)
  # To build for production, use: eas build --platform ios/android

