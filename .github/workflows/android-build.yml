name: Android Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
        
    - name: Install dependencies
      working-directory: ./TikSaveRN
      run: bun install --frozen-lockfile
      
    - name: Run ESLint
      working-directory: ./TikSaveRN
      run: bun run lint
      continue-on-error: true
      
    - name: Run TypeScript type check
      working-directory: ./TikSaveRN
      run: bun run typecheck
      continue-on-error: true
      
  # Note: For actual Android builds, use EAS Build
  # This workflow focuses on CI checks (linting, type checking)
  # To build for production, use: eas build --platform android

