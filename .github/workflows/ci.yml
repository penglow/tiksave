name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.set.outputs.mobile }}
      backend: ${{ steps.set.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            mobile:
              - 'TikSaveRN/**'
              - '.bun-version'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            backend:
              - 'backend/**'
              - '.bun-version'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

      - name: Set job outputs
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=${{ steps.filter.outputs.mobile }}" >> "$GITHUB_OUTPUT"
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
          fi

  mobile:
    name: Mobile app
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: TikSaveRN

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: Prettier
        run: bun run format:check

      - name: TypeScript
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

  backend:
    name: Backend API
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://tiksave:tiksave_password@localhost:5432/tiksave_test
      TEST_DATABASE_URL: postgresql://tiksave:tiksave_password@localhost:5432/tiksave_test
      REDIS_URL: redis://localhost:6379
      TEST_REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-test-jwt-secret-do-not-use-in-production
      NODE_ENV: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tiksave
          POSTGRES_PASSWORD: tiksave_password
          POSTGRES_DB: tiksave_test
        options: >-
          --health-cmd pg_isready -U tiksave -d tiksave_test
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Database migrations
        run: bun run migrate

      - name: Unit tests
        run: bun run test:unit

      - name: Scenario tests
        run: bun run test:scenarios

      - name: Security tests (fast)
        run: bun run test:security:fast

      - name: Integration tests
        run: bun run test:integration

      - name: Build
        run: bun run build

      - name: Verify build output
        working-directory: ${{ github.workspace }}
        run: test -f backend/dist/index.js
